{{- $fn := include "sokkan.fullname" . -}}
{{- if and (not .Values.secrets.existingSecret) (not .Values.externalSecret.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fn }}-env
  labels:
    {{- include "sokkan.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.values }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- end }}
{{- if eq .Values.runner.mode "kubernetes" }}
---
# derives the session tokens (api ↔ supervisor, MCP relay): stable across api restarts so
# that a restarted api reattaches to the live session pods. Generated once, then kept.
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-runner" $fn) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fn }}-runner
  labels:
    {{- include "sokkan.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $existing }}
  runner-secret: {{ index $existing.data "runner-secret" }}
  {{- else }}
  runner-secret: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
{{- if and (not .Values.database.existingSecret) (or .Values.database.url .Values.devPostgres.enabled) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fn }}-db
  labels:
    {{- include "sokkan.labels" . | nindent 4 }}
type: Opaque
{{- if .Values.database.url }}
stringData:
  {{ .Values.database.secretKey }}: {{ .Values.database.url | quote }}
{{- else }}
{{- $old := lookup "v1" "Secret" .Release.Namespace (printf "%s-db" $fn) }}
{{- $pw := .Values.devPostgres.password }}
{{- if not $pw }}
{{- if and $old $old.data (hasKey $old.data "POSTGRES_PASSWORD") }}
{{- $pw = index $old.data "POSTGRES_PASSWORD" | b64dec }}
{{- else }}
{{- $pw = randAlphaNum 24 }}
{{- end }}
{{- end }}
stringData:
  POSTGRES_PASSWORD: {{ $pw | quote }}
  {{ .Values.database.secretKey }}: {{ printf "postgresql://sokkan:%s@%s-postgres:5432/sokkan" $pw $fn | quote }}
{{- end }}
{{- end }}
{{- if .Values.externalSecret.enabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $fn }}-env
  labels:
    {{- include "sokkan.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    {{- toYaml .Values.externalSecret.secretStoreRef | nindent 4 }}
  target:
    name: {{ $fn }}-env
  data:
    {{- toYaml .Values.externalSecret.data | nindent 4 }}
{{- end }}
