# 4.0 « Seven seas », experimental — the kernel engine as a service next to the api
# (backend/harness/kernel.py, docs in backend/harness/README.md):
#   COMPOSE_PROFILES=kernel docker compose -f docker-compose.yml -f docker-compose.kernel.yml up -d
# and SOKKAN_ENGINE_RUNTIME=kernel for the sessions to run on it.
#
# * The kernel is a CONTAINER IMAGE (SOKKAN_KERNEL_IMAGE, pinned by tag), never source in this
#   repository. Its configuration: deploy/kernel/config.example.yaml, copied to
#   deploy/kernel/config.yaml and filled by the operator (model endpoints, no secret inside).
# * The api reads the kernel's local token from the shared volume kernel-token; both run under
#   the same uid (1000, the api's), so the 0600 token is readable by the api only.
# * The projects (/data/projects of the volume sokkan-data) are mounted at the SAME path in the
#   kernel: the folder the api hands to a run is the folder the kernel works in.
# * NOT FOR A REAL INSTANCE YET: this file runs the kernel's tools in its own container
#   (`local.code.backend: local`). The kernel's local token is then a file its model could read;
#   a real instance needs the kernel's docker sandbox (a docker-socket proxy) — see the design
#   note of lot 1. Nothing here publishes a port.
services:
  kernel:
    image: ${SOKKAN_KERNEL_IMAGE:?set SOKKAN_KERNEL_IMAGE to a pinned kernel image}
    profiles: ["kernel"]
    restart: unless-stopped
    init: true
    user: "1000:1000"
    entrypoint: ["python3", "-m", "nokker", "--config", "/etc/kernel/config.yaml", "serve"]
    environment:
      NOKKER_CONFIG: /etc/kernel/config.yaml
      NOKKER_HOME: /opt/data
      NOKKER_ALLOWED_HOSTS: kernel:8742
      SOKKAN_KERNEL_MODEL_KEY: ${SOKKAN_KERNEL_MODEL_KEY:-}
    volumes:
      - ./deploy/kernel/config.yaml:/etc/kernel/config.yaml:ro
      - kernel-state:/opt/data
      - kernel-token:/run/kernel
      - sokkan-data:/data
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8742/healthz', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  api:
    environment:
      SOKKAN_KERNEL_URL: ${SOKKAN_KERNEL_URL:-http://kernel:8742}
      SOKKAN_KERNEL_TOKEN_FILE: /run/kernel/local-token
    volumes:
      - kernel-token:/run/kernel:ro

volumes:
  kernel-state:
  kernel-token:
