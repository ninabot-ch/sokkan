# SOKKAN — self-hosted, single-user by default. See .env.example.

# Memory engine (CortHeXis): llama.cpp model servers and the first-run model setup
# (Gemma Terms of Use accepted → EmbeddingGemma, else an MIT model) are services of
# this file (no `include:` — any Docker Compose v2 runs it). GPU: the accelerator file
# docker/embed/compose.sycl.yml (Intel Arc) or compose.cuda.yml (NVIDIA) is added by
# scripts/memory-setup.sh through COMPOSE_FILE in .env; the reranker runs with
# COMPOSE_PROFILES=rerank. Standalone copy for CortHeXis alone: docker/embed/compose.yml.
x-llamacpp: &llamacpp
  image: ghcr.io/ggml-org/llama.cpp:${CORTHEXIS_LLAMACPP_TAG:-server-b11347}
  restart: unless-stopped
  entrypoint: ["/bin/sh", "/opt/corthexis/run.sh"]
  volumes:
    - corthexis-models:/models:ro
    - ./docker/embed/run.sh:/opt/corthexis/run.sh:ro
  depends_on:
    corthexis-embed-fetch:
      condition: service_completed_successfully
  security_opt:
    - no-new-privileges:true
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 60s

services:
  api:
    build: { context: ., dockerfile: docker/api.Dockerfile, args: { SOKKAN_COMMIT: "${SOKKAN_COMMIT:-unknown}" } }
    restart: unless-stopped
    environment:
      # BYOK — your Anthropic API key (or mount your ~/.claude, see README)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # subscription (Claude Pro/Max): token from `claude setup-token`
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # access token asked on the login screen; leave empty for open access
      # (only do that on a trusted network)
      SOKKAN_LOCAL_TOKEN: ${SOKKAN_LOCAL_TOKEN:-}
      SOKKAN_OWNER_EMAIL: ${SOKKAN_OWNER_EMAIL:-owner@localhost}
      SOKKAN_OWNER_NAME: ${SOKKAN_OWNER_NAME:-Owner}
      SOKKAN_TZ: ${SOKKAN_TZ:-Europe/Zurich}
      SOKKAN_PUBLIC_URL: ${SOKKAN_PUBLIC_URL:-http://localhost:3009}
      SOKKAN_TIER: ${SOKKAN_TIER:-}
      # daily update check (see .env.example); version written by install.sh
      SOKKAN_VERSION: ${SOKKAN_VERSION:-dev}
      SOKKAN_UPDATE_CHECK: ${SOKKAN_UPDATE_CHECK:-1}
      # optional remote embedding service; empty = local ONNX (fastembed)
      ML_SERVICE_URL: ${ML_SERVICE_URL:-}
      # 2.x custom fastembed model: serves the 2.x index during the migration and, with
      # no SOKKAN_MEMORY_PROFILE, maps to the `legacy` profile (declared here: a variable
      # only in .env never reaches the container — the 2.0.1 trap)
      SOKKAN_EMBED_MODEL: ${SOKKAN_EMBED_MODEL:-}
      # memory profile (leger | standard | gpu; written by scripts/memory-setup.sh).
      # Empty = 2.x behaviour: `remote` when ML_SERVICE_URL is set, else leger.
      CORTHEXIS_MEMORY_PROFILE: ${SOKKAN_MEMORY_PROFILE:-}
      CORTHEXIS_MODELS_DIR: /models
      # optional overrides: embedding servers tried in order (e.g. a Magnitude GPU
      # node, then the local container) and reranker URL ("off" disables it)
      CORTHEXIS_EMBED_URLS: ${SOKKAN_EMBED_URLS:-}
      CORTHEXIS_RERANK_URL: ${SOKKAN_RERANK_URL:-}
      # memory engine (CortHeXis) 3.0: Postgres + pgvector store of the `db` service,
      # filled by the 3.0 indexer (start, file changes, every CORTHEXIS_REINDEX_S).
      # auto = an existing 2.x memory is migrated at the first start (archive, normalize,
      # dates, generation 1 — see docs/UPGRADE.md) while memory.db keeps serving, then the
      # store serves (a new install goes straight to the store); sqlite = stay on the 2.x
      # index; postgres = the store only, no migration.
      # empty = the `db` service below (memory/store_backend.py builds the URL from
      # SOKKAN_DB_PASSWORD: a nested default here needs Docker Compose 2.20+)
      CORTHEXIS_DATABASE_URL: ${CORTHEXIS_DATABASE_URL:-}
      SOKKAN_DB_PASSWORD: ${SOKKAN_DB_PASSWORD:-sokkan}
      CORTHEXIS_MEMORY_BACKEND: ${CORTHEXIS_MEMORY_BACKEND:-auto}
      # repairs of the notes during the migration: auto | ask (wait for the go in the UI) | off
      CORTHEXIS_MIGRATION_NORMALIZE: ${SOKKAN_MIGRATION_NORMALIZE:-auto}
      # memory recall injected at every message and into every sub-agent (0 = off)
      CORTHEXIS_RECALL: ${CORTHEXIS_RECALL:-1}
      CORTHEXIS_LEXICAL_WEIGHT: ${CORTHEXIS_LEXICAL_WEIGHT:-}
      CORTHEXIS_HNSW_EF_SEARCH: ${CORTHEXIS_HNSW_EF_SEARCH:-}
      # optional model override for spawned sessions (default: CLI default)
      SOKKAN_AGENT_MODEL: ${SOKKAN_AGENT_MODEL:-}
      # included-inference mode (seeded at provisioning): route sessions through
      # the operator gateway instead of a client key. Empty = BYOK.
      SOKKAN_INFER_BASE_URL: ${SOKKAN_INFER_BASE_URL:-}
      SOKKAN_INFER_TOKEN: ${SOKKAN_INFER_TOKEN:-}
      SOKKAN_INFER_MODEL: ${SOKKAN_INFER_MODEL:-}
      # Nina, the embedded DevOps assistant. Server-side feature flag; the
      # LLM vars are seeded at provisioning on managed instances (house
      # account — we pay), and optional self-host (falls back to your own
      # configured model when only the flag is set).
      SOKKAN_FEATURE_ASSISTANT: ${SOKKAN_FEATURE_ASSISTANT:-0}
      SOKKAN_ASSISTANT_LLM_URL: ${SOKKAN_ASSISTANT_LLM_URL:-}
      SOKKAN_ASSISTANT_LLM_TOKEN: ${SOKKAN_ASSISTANT_LLM_TOKEN:-}
      SOKKAN_ASSISTANT_LLM_MODEL: ${SOKKAN_ASSISTANT_LLM_MODEL:-}
      SOKKAN_ASSISTANT_LLM_API: ${SOKKAN_ASSISTANT_LLM_API:-}
      SOKKAN_ASSISTANT_LLM_FALLBACK_URL: ${SOKKAN_ASSISTANT_LLM_FALLBACK_URL:-}
      SOKKAN_ASSISTANT_LLM_FALLBACK_TOKEN: ${SOKKAN_ASSISTANT_LLM_FALLBACK_TOKEN:-}
      SOKKAN_ASSISTANT_LLM_FALLBACK_MODEL: ${SOKKAN_ASSISTANT_LLM_FALLBACK_MODEL:-}
      SOKKAN_ASSISTANT_LLM_FALLBACK_API: ${SOKKAN_ASSISTANT_LLM_FALLBACK_API:-}
      SOKKAN_ASSISTANT_DAILY_LIMIT: ${SOKKAN_ASSISTANT_DAILY_LIMIT:-}
      SOKKAN_ASSISTANT_MAX_TOKENS: ${SOKKAN_ASSISTANT_MAX_TOKENS:-}
      # API flotte : le client gère/étend son infra depuis le cockpit
      SOKKAN_FLEET_URL: ${SOKKAN_FLEET_URL:-}
      SOKKAN_FLEET_TOKEN: ${SOKKAN_FLEET_TOKEN:-}
      # rôle des identités inconnues (viewer par défaut ; none = 403)
      SOKKAN_DEFAULT_ROLE: ${SOKKAN_DEFAULT_ROLE:-}   # empty = the edition's default (community viewer, enterprise none)
      # SSO (feature `sso`, docs/enterprise/OPERATIONS.md § 2) — local = jeton d'accès ;
      # oidc = IdP (Entra ID, Authentik, Keycloak…). Le secret reste dans .env (0600).
      SOKKAN_AUTH_MODE: ${SOKKAN_AUTH_MODE:-local}
      SOKKAN_OIDC_ISSUER: ${SOKKAN_OIDC_ISSUER:-}
      SOKKAN_OIDC_CLIENT_ID: ${SOKKAN_OIDC_CLIENT_ID:-}
      SOKKAN_OIDC_CLIENT_SECRET: ${SOKKAN_OIDC_CLIENT_SECRET:-}
      SOKKAN_OIDC_SCOPES: ${SOKKAN_OIDC_SCOPES:-openid email profile}
      SOKKAN_OIDC_GROUPS_CLAIM: ${SOKKAN_OIDC_GROUPS_CLAIM:-groups}
      SOKKAN_OPS_GROUP: ${SOKKAN_OPS_GROUP:-}
      # intégrations (Infra, Operate, lien CortHeXis) — vides = désactivées
      SOKKAN_PROM: ${SOKKAN_PROM:-}
      # noms des hôtes (3.2.3) : JSON ip → nom, prioritaire sur /etc/hosts, Tailscale, DNS inverse
      SOKKAN_HOSTS: ${SOKKAN_HOSTS:-}
      SOKKAN_GRAFANA_URL: ${SOKKAN_GRAFANA_URL:-}
      SOKKAN_LOKI: ${SOKKAN_LOKI:-}
      # Operate › Alerts (3.5, docs/OPERATE.md § Alerts) — règles évaluées par l'api ; vide =
      # défaut de l'édition (on). SMTP = canal e-mail des alertes (optionnel).
      SOKKAN_FEATURE_ALERTING: ${SOKKAN_FEATURE_ALERTING:-}
      SOKKAN_ALERTING_TICK_S: ${SOKKAN_ALERTING_TICK_S:-15}
      SOKKAN_ALERTING_EVALUATOR: ${SOKKAN_ALERTING_EVALUATOR:-1}
      SOKKAN_ALERTING_SOURCE_TIMEOUT_S: ${SOKKAN_ALERTING_SOURCE_TIMEOUT_S:-10}
      SOKKAN_ALERTING_TEST_TIMEOUT_S: ${SOKKAN_ALERTING_TEST_TIMEOUT_S:-15}
      # Document ingestion (experimental, docs/enterprise/DOC-INGEST.md) — off by default. The
      # image needs the extractors (build arg SOKKAN_DOC_INGEST=1) and the documents mounted
      # read-only (docker-compose.doc-ingest.yml). The model MUST be local.
      SOKKAN_FEATURE_DOC_INGEST: ${SOKKAN_FEATURE_DOC_INGEST:-}
      SOKKAN_DOC_INGEST_LLM_URL: ${SOKKAN_DOC_INGEST_LLM_URL:-}
      SOKKAN_DOC_INGEST_LLM_MODEL: ${SOKKAN_DOC_INGEST_LLM_MODEL:-}
      SOKKAN_DOC_INGEST_LLM_KEY: ${SOKKAN_DOC_INGEST_LLM_KEY:-}
      SOKKAN_DOC_INGEST_ALLOW_REMOTE_LLM: ${SOKKAN_DOC_INGEST_ALLOW_REMOTE_LLM:-}
      SOKKAN_DOC_INGEST_DIR: ${SOKKAN_DOC_INGEST_DIR:-}
      SOKKAN_DOC_INGEST_CONFIG: ${SOKKAN_DOC_INGEST_CONFIG:-}
      SOKKAN_DOC_INGEST_RCLONE: ${SOKKAN_DOC_INGEST_RCLONE:-}
      SOKKAN_DOC_INGEST_RCLONE_CONFIG: ${SOKKAN_DOC_INGEST_RCLONE_CONFIG:-}
      SOKKAN_DOC_INGEST_DOCLING: ${SOKKAN_DOC_INGEST_DOCLING:-}
      SOKKAN_DOC_INGEST_PYTHON: ${SOKKAN_DOC_INGEST_PYTHON:-}
      SOKKAN_DOC_INGEST_CONCURRENCY: ${SOKKAN_DOC_INGEST_CONCURRENCY:-}
      SOKKAN_DOC_INGEST_MAX_FILE_MB: ${SOKKAN_DOC_INGEST_MAX_FILE_MB:-}
      SOKKAN_DOC_INGEST_MAX_DOC_CHARS: ${SOKKAN_DOC_INGEST_MAX_DOC_CHARS:-}
      SOKKAN_DOC_INGEST_EXTRACT_TIMEOUT_S: ${SOKKAN_DOC_INGEST_EXTRACT_TIMEOUT_S:-}
      SOKKAN_DOC_INGEST_EXTRACT_MEM_MB: ${SOKKAN_DOC_INGEST_EXTRACT_MEM_MB:-}
      SOKKAN_DOC_INGEST_MAX_TOKENS_PER_PASS: ${SOKKAN_DOC_INGEST_MAX_TOKENS_PER_PASS:-}
      SOKKAN_DOC_INGEST_MAX_DOCS_PER_PASS: ${SOKKAN_DOC_INGEST_MAX_DOCS_PER_PASS:-}
      SOKKAN_DOC_INGEST_MAX_MINUTES_PER_PASS: ${SOKKAN_DOC_INGEST_MAX_MINUTES_PER_PASS:-}
      SOKKAN_DOC_INGEST_REVIEW_MIN_SAMPLE: ${SOKKAN_DOC_INGEST_REVIEW_MIN_SAMPLE:-}
      SOKKAN_DOC_INGEST_AUTO_RESUME: ${SOKKAN_DOC_INGEST_AUTO_RESUME:-}
      SOKKAN_SMTP_HOST: ${SOKKAN_SMTP_HOST:-}
      SOKKAN_SMTP_PORT: ${SOKKAN_SMTP_PORT:-587}
      SOKKAN_SMTP_USER: ${SOKKAN_SMTP_USER:-}
      SOKKAN_SMTP_PASSWORD: ${SOKKAN_SMTP_PASSWORD:-}
      SOKKAN_SMTP_FROM: ${SOKKAN_SMTP_FROM:-}
      SOKKAN_CORTEX_URL: ${SOKKAN_CORTEX_URL:-}
      # bannière de visite guidée (démo publique read-only uniquement)
      SOKKAN_DEMO_BANNER: ${SOKKAN_DEMO_BANNER:-0}
      # budgets de coût estimé en USD (0 = off ; modifiables aussi dans Profil)
      SOKKAN_BUDGET_SESSION_USD: ${SOKKAN_BUDGET_SESSION_USD:-0}
      SOKKAN_BUDGET_DAY_USD: ${SOKKAN_BUDGET_DAY_USD:-0}
      # Costs (3.2.3) : base de facturation Claude forcée (api | subscription ; vide = déduite
      # de la config), transcripts non lancés par SOKKAN comptés (include) ou non (vide),
      # tarifs Claude ajoutés/surchargés (chemin d'un JSON, cf backend/model_prices.json)
      SOKKAN_BILLING_BASIS: ${SOKKAN_BILLING_BASIS:-}
      SOKKAN_USAGE_EXTERNAL: ${SOKKAN_USAGE_EXTERNAL:-}
      SOKKAN_CLAUDE_PRICES: ${SOKKAN_CLAUDE_PRICES:-}
      # 3.4.4 : rafraîchissement de Costs en fond (s ; 0 = coupé) — l'écran ne re-parse plus à froid
      SOKKAN_USAGE_REFRESH_S: ${SOKKAN_USAGE_REFRESH_S:-}
      # agents — onglet Crew (3.1) : ordonnanceur, concurrence, rattrapage
      SOKKAN_FEATURE_AGENTS: ${SOKKAN_FEATURE_AGENTS:-1}
      SOKKAN_AGENTS_MAX_CONCURRENT: ${SOKKAN_AGENTS_MAX_CONCURRENT:-2}
      SOKKAN_AGENTS_MISFIRE_S: ${SOKKAN_AGENTS_MISFIRE_S:-21600}
      # qui approuve un agent : owner | admin | four_eyes (vide = défaut de l'édition)
      SOKKAN_AGENTS_APPROVAL: ${SOKKAN_AGENTS_APPROVAL:-}
      # secrets des sessions humaines : named (défaut 3.2) | all (comportement 3.1)
      SOKKAN_SESSION_SECRETS: ${SOKKAN_SESSION_SECRETS:-named}
      # 3.2 : l'ordonnanceur n'utilise un login Claude CLI que si on le déclare ici (=1)
      SOKKAN_AGENTS_USE_CLI_LOGIN: ${SOKKAN_AGENTS_USE_CLI_LOGIN:-0}
      # 3.2 : durée d'une session du cockpit (secondes, 5 min à 24 h)
      SOKKAN_SESSION_TTL_S: ${SOKKAN_SESSION_TTL_S:-28800}
      # 3.1.1 : un run d'agent en échec / timeout / budget ouvre son incident dans Operate
      # 3.2 : vide = actif dès qu'Operate l'est (Prometheus/Grafana), 0 = coupé, 1 = forcé
      SOKKAN_AGENTS_INCIDENTS: ${SOKKAN_AGENTS_INCIDENTS:-}
      # 3.1.1 : Crew visible en LECTURE SEULE pour un viewer (démo publique)
      SOKKAN_CREW_VIEWER_READONLY: ${SOKKAN_CREW_VIEWER_READONLY:-0}
      # 3.1.1 : runs SIMULÉS de la démo publique (exige SOKKAN_DEMO_BANNER=1, aucune inférence)
      SOKKAN_DEMO_CREW: ${SOKKAN_DEMO_CREW:-0}
      # 3.2.2 : démo publique « Captains » — Helm, projets, Setup en lecture seule (exige DEMO_BANNER + projets)
      SOKKAN_DEMO_CAPTAINS: ${SOKKAN_DEMO_CAPTAINS:-0}
      # 3.2 feature registry (backend/features.py, docs/enterprise/FEATURES.md):
      # community (default) | enterprise — empty switches = the edition's default
      SOKKAN_EDITION: ${SOKKAN_EDITION:-}
      SOKKAN_FEATURE_TMUX: ${SOKKAN_FEATURE_TMUX:-}
      SOKKAN_FEATURE_PREVIEW: ${SOKKAN_FEATURE_PREVIEW:-}
      SOKKAN_FEATURE_PREVIEW_PRIVATE_TARGETS: ${SOKKAN_FEATURE_PREVIEW_PRIVATE_TARGETS:-}
      SOKKAN_PREVIEW_ALLOW_PRIVATE: ${SOKKAN_PREVIEW_ALLOW_PRIVATE:-}
      SOKKAN_FEATURE_MAGNITUDE: ${SOKKAN_FEATURE_MAGNITUDE:-}
      SOKKAN_MAGNITUDE_SHIM_URL: ${SOKKAN_MAGNITUDE_SHIM_URL:-}
      SOKKAN_METRICS_TOKEN: ${SOKKAN_METRICS_TOKEN:-}
      SOKKAN_FEATURE_MISSIONS_LINK: ${SOKKAN_FEATURE_MISSIONS_LINK:-}
      SOKKAN_FEATURE_UPDATE_CHECK: ${SOKKAN_FEATURE_UPDATE_CHECK:-}
      SOKKAN_FEATURE_NAMED_SECRETS: ${SOKKAN_FEATURE_NAMED_SECRETS:-}
      SOKKAN_FEATURE_AGENTS_CLI_LOGIN: ${SOKKAN_FEATURE_AGENTS_CLI_LOGIN:-}
      SOKKAN_FEATURE_FOUR_EYES: ${SOKKAN_FEATURE_FOUR_EYES:-}
      SOKKAN_FEATURE_ADMIN_APPROVAL: ${SOKKAN_FEATURE_ADMIN_APPROVAL:-}
      SOKKAN_FEATURE_AGENT_INCIDENTS: ${SOKKAN_FEATURE_AGENT_INCIDENTS:-}
      SOKKAN_FEATURE_CREW_VIEWER_READONLY: ${SOKKAN_FEATURE_CREW_VIEWER_READONLY:-}
      SOKKAN_FEATURE_DEMO_BANNER: ${SOKKAN_FEATURE_DEMO_BANNER:-}
      SOKKAN_FEATURE_DEMO_CREW: ${SOKKAN_FEATURE_DEMO_CREW:-}
      SOKKAN_FEATURE_DEMO_CAPTAINS: ${SOKKAN_FEATURE_DEMO_CAPTAINS:-}
      SOKKAN_FEATURE_MULTI_PROJECT: ${SOKKAN_FEATURE_MULTI_PROJECT:-}
      SOKKAN_FEATURE_SSO_TEAMS: ${SOKKAN_FEATURE_SSO_TEAMS:-}
      SOKKAN_FEATURE_OPS_TEAM: ${SOKKAN_FEATURE_OPS_TEAM:-}
      # lot 4 : coffre, budgets, noms d'agents, revue CortHeXis et journal PAR PROJET
      SOKKAN_FEATURE_PROJECT_VAULT_BUDGETS: ${SOKKAN_FEATURE_PROJECT_VAULT_BUDGETS:-}
      # lot 5 — GitLab: rights read with the person's account, push in their name
      # (docs/enterprise/OPERATIONS.md « GitLab »). Tokens: Fernet, $DATA/forge.key.
      SOKKAN_FEATURE_GITLAB: ${SOKKAN_FEATURE_GITLAB:-}
      SOKKAN_GITLAB_URL: ${SOKKAN_GITLAB_URL:-}
      SOKKAN_GITLAB_CLIENT_ID: ${SOKKAN_GITLAB_CLIENT_ID:-}
      SOKKAN_GITLAB_CLIENT_SECRET: ${SOKKAN_GITLAB_CLIENT_SECRET:-}
      SOKKAN_GITLAB_REDIRECT_URI: ${SOKKAN_GITLAB_REDIRECT_URI:-}
      SOKKAN_GITLAB_CA_BUNDLE: ${SOKKAN_GITLAB_CA_BUNDLE:-}
      # ui features (3.2): shared review, Model keys (BYOK), Connect your AI —
      # docs/enterprise/UI-FEATURES.md
      SOKKAN_FEATURE_SHARED_REVIEW: ${SOKKAN_FEATURE_SHARED_REVIEW:-}
      SOKKAN_FEATURE_BYOK_ADMIN: ${SOKKAN_FEATURE_BYOK_ADMIN:-}
      SOKKAN_FEATURE_CONNECT_AI: ${SOKKAN_FEATURE_CONNECT_AI:-}
      SOKKAN_CONNECT_AI_MODE: ${SOKKAN_CONNECT_AI_MODE:-}
      SOKKAN_ROUTER_URL: ${SOKKAN_ROUTER_URL:-}
      SOKKAN_ROUTER_MODEL: ${SOKKAN_ROUTER_MODEL:-}
      SOKKAN_ROUTER_WELCOME_URL: ${SOKKAN_ROUTER_WELCOME_URL:-}
      # study mode (docs/enterprise/STUDY-MODE.md): audited use under a research protocol —
      # tags, pseudonyms at the source, consent, researcher's export. The state (active,
      # end date, ceilings) is read from the inference gateway; SOKKAN_STUDY_ID declares a
      # study locally when the gateway does not serve it.
      SOKKAN_FEATURE_STUDY_MODE: ${SOKKAN_FEATURE_STUDY_MODE:-}
      SOKKAN_STUDY_ID: ${SOKKAN_STUDY_ID:-}
      SOKKAN_STUDY_EXPIRES_AT: ${SOKKAN_STUDY_EXPIRES_AT:-}
      SOKKAN_STUDY_AUDIT_REQUIRED: ${SOKKAN_STUDY_AUDIT_REQUIRED:-}
      SOKKAN_STUDY_DB: ${SOKKAN_STUDY_DB:-}
      SOKKAN_GATEWAY_URL: ${SOKKAN_GATEWAY_URL:-}
      SOKKAN_GATEWAY_ADMIN_TOKEN: ${SOKKAN_GATEWAY_ADMIN_TOKEN:-}
      SOKKAN_GATEWAY_CLIENT: ${SOKKAN_GATEWAY_CLIENT:-}
      # 3.3: secrets provider — file (default) | openbao | kubernetes (docs/enterprise/SECRETS.md).
      # Explicit only: SOKKAN_OPENBAO_ADDR without SOKKAN_SECRETS_PROVIDER=openbao keeps files.
      # AppRole in compose: SOKKAN_OPENBAO_SECRET_ID_FILE points at a file mounted read-only.
      SOKKAN_FEATURE_SECRETS_PROVIDER: ${SOKKAN_FEATURE_SECRETS_PROVIDER:-}
      SOKKAN_SECRETS_PROVIDER: ${SOKKAN_SECRETS_PROVIDER:-}
      SOKKAN_INSTANCE_ID: ${SOKKAN_INSTANCE_ID:-}
      SOKKAN_OPENBAO_ADDR: ${SOKKAN_OPENBAO_ADDR:-}
      SOKKAN_OPENBAO_AUTH: ${SOKKAN_OPENBAO_AUTH:-}
      SOKKAN_OPENBAO_ROLE_ID: ${SOKKAN_OPENBAO_ROLE_ID:-}
      SOKKAN_OPENBAO_SECRET_ID_FILE: ${SOKKAN_OPENBAO_SECRET_ID_FILE:-}
      SOKKAN_OPENBAO_K8S_ROLE: ${SOKKAN_OPENBAO_K8S_ROLE:-}
      SOKKAN_OPENBAO_CACERT: ${SOKKAN_OPENBAO_CACERT:-}
      SOKKAN_OPENBAO_NAMESPACE: ${SOKKAN_OPENBAO_NAMESPACE:-}
      SOKKAN_OPENBAO_KV_MOUNT: ${SOKKAN_OPENBAO_KV_MOUNT:-}
      SOKKAN_OPENBAO_TRANSIT_MOUNT: ${SOKKAN_OPENBAO_TRANSIT_MOUNT:-}
      SOKKAN_OPENBAO_TRANSIT_KEY: ${SOKKAN_OPENBAO_TRANSIT_KEY:-}
      # 3.4 : classification et habilitations, puis Microsoft Teams (docs/enterprise/SECURITY.md,
      # docs/enterprise/TEAMS.md) — libellés de la grille du client, niveau lu par rôle de projet
      SOKKAN_FEATURE_CLASSIFICATION: ${SOKKAN_FEATURE_CLASSIFICATION:-}
      SOKKAN_CLASSIFICATION_LABELS: ${SOKKAN_CLASSIFICATION_LABELS:-}
      SOKKAN_CLEARANCE_ROLES: ${SOKKAN_CLEARANCE_ROLES:-}
      SOKKAN_FEATURE_TEAMS: ${SOKKAN_FEATURE_TEAMS:-}
      SOKKAN_TEAMS_APP_ID: ${SOKKAN_TEAMS_APP_ID:-}
      SOKKAN_TEAMS_APP_PASSWORD: ${SOKKAN_TEAMS_APP_PASSWORD:-}
      SOKKAN_TEAMS_APP_PASSWORD_FILE: ${SOKKAN_TEAMS_APP_PASSWORD_FILE:-}
      SOKKAN_TEAMS_TENANT_ID: ${SOKKAN_TEAMS_TENANT_ID:-}
      SOKKAN_TEAMS_PUBLIC_URL: ${SOKKAN_TEAMS_PUBLIC_URL:-}
      SOKKAN_TEAMS_PROACTIVE_S: ${SOKKAN_TEAMS_PROACTIVE_S:-}
      SOKKAN_TEAMS_SERVICE_URL: ${SOKKAN_TEAMS_SERVICE_URL:-}
      # 3.1 : réglages fins déjà documentés (docs/AGENTS.md), jusqu'ici non transmis
      SOKKAN_AGENTS_TICK_S: ${SOKKAN_AGENTS_TICK_S:-15}
      SOKKAN_MEMORY_QUARANTINE_DIR: ${SOKKAN_MEMORY_QUARANTINE_DIR:-}
      # 3.1.2 : coût des runs sur un modèle non-Claude (passerelle, endpoint custom) —
      # plafond en tokens si le prix est inconnu, table de prix (JSON), change CHF→USD
      SOKKAN_AGENTS_MAX_TOKENS_PER_RUN: ${SOKKAN_AGENTS_MAX_TOKENS_PER_RUN:-5000000}
      SOKKAN_MODEL_PRICES: ${SOKKAN_MODEL_PRICES:-}
      SOKKAN_FX_USD_PER_CHF: ${SOKKAN_FX_USD_PER_CHF:-1.30}
      # 3.4.4 : coût estimé du 1er appel d'un run (tokens écrits au cache) — un budget en dessous ne démarre pas
      SOKKAN_AGENTS_FIRST_CALL_TOKENS: ${SOKKAN_AGENTS_FIRST_CALL_TOKENS:-}
      # lots 6/8 — révocation (SCIM, « Revoke now ») et bac à sable par projet
      SOKKAN_FEATURE_REVOCATION: ${SOKKAN_FEATURE_REVOCATION:-}
      SOKKAN_SCIM_TOKEN: ${SOKKAN_SCIM_TOKEN:-}
      SOKKAN_SCIM_GROUP_KEY: ${SOKKAN_SCIM_GROUP_KEY:-displayName}
      SOKKAN_OIDC_FRONTCHANNEL_LOGOUT: ${SOKKAN_OIDC_FRONTCHANNEL_LOGOUT:-0}  # 3.4: Entra ID front-channel logout
      SOKKAN_FEATURE_SANDBOX: ${SOKKAN_FEATURE_SANDBOX:-}
      SOKKAN_SANDBOX_BWRAP: ${SOKKAN_SANDBOX_BWRAP:-}
      SOKKAN_SANDBOX_NETWORK: ${SOKKAN_SANDBOX_NETWORK:-0}
      SOKKAN_SANDBOX_RO_PATHS: ${SOKKAN_SANDBOX_RO_PATHS:-}
      SOKKAN_SANDBOX_READ_PATHS: ${SOKKAN_SANDBOX_READ_PATHS:-}
      # helm — 3.3 (docs/HELM.md) : hiérarchie de cartes, avancement calculé, suggestions de
      # recadrage (job toutes les SOKKAN_HELM_TICK_S), brief du matin (agenda ICS, NOM d'un
      # secret du coffre). Exige multi_project + assistant ; vide = défaut de l'édition.
      SOKKAN_FEATURE_HELM: ${SOKKAN_FEATURE_HELM:-}
      SOKKAN_HELM_TICK_S: ${SOKKAN_HELM_TICK_S:-900}
      SOKKAN_HELM_DRIFT_MIN: ${SOKKAN_HELM_DRIFT_MIN:-0.25}
      SOKKAN_HELM_SNOOZE_DAYS: ${SOKKAN_HELM_SNOOZE_DAYS:-7}
      SOKKAN_HELM_CALENDAR_ICS: ${SOKKAN_HELM_CALENDAR_ICS:-}
      SOKKAN_HELM_CALENDAR_ALLOW_PRIVATE: ${SOKKAN_HELM_CALENDAR_ALLOW_PRIVATE:-0}
      # runner — where the CLI of a session / agent run executes (feature kubernetes_runner,
      # docs/enterprise/KUBERNETES.md). local (default) = inside this container, as before;
      # docker = one container per session: add docker/runner/compose.docker-runner.yml
      # to COMPOSE_FILE (it sets the variables below); kubernetes = the Helm chart.
      SOKKAN_FEATURE_KUBERNETES_RUNNER: ${SOKKAN_FEATURE_KUBERNETES_RUNNER:-}
      SOKKAN_RUNNER: ${SOKKAN_RUNNER:-local}
      # docker runner : valeurs posées par docker/runner/compose.docker-runner.yml (vide = défauts)
      SOKKAN_SESSION_IMAGE: ${SOKKAN_SESSION_IMAGE:-}
      SOKKAN_RUNNER_MOUNTS: ${SOKKAN_RUNNER_MOUNTS:-}
      SOKKAN_RUNNER_RELAY_ADDR: ${SOKKAN_RUNNER_RELAY_ADDR:-}
      # ---- 3.6 : every variable the backend reads reaches the container ------------------
      # (tests/test_compose_env.py fails when one is read but neither declared here nor
      # classified there; reference with defaults: docs/ENVIRONMENT.md). Empty = the default
      # of the code.
      # identity of the instance, cockpit session cookie key (empty = generated in the volume)
      SOKKAN_ORG_NAME: ${SOKKAN_ORG_NAME:-}
      SOKKAN_SESSION_SECRET: ${SOKKAN_SESSION_SECRET:-}
      # where the update check and the Missions counter read (mirror / air gap)
      SOKKAN_DIST_BASE: ${SOKKAN_DIST_BASE:-}
      SOKKAN_MISSIONS_STATS_URL: ${SOKKAN_MISSIONS_STATS_URL:-}
      # Operate: bearer of POST /api/observability/alert, Grafana account, public Grafana URL,
      # nodes of the Infra tab (JSON), hosts file, reverse-DNS timeout
      SOKKAN_OBS_ALERT_TOKEN: ${SOKKAN_OBS_ALERT_TOKEN:-}
      SOKKAN_GRAFANA_USER: ${SOKKAN_GRAFANA_USER:-}
      SOKKAN_GRAFANA_PASSWORD: ${SOKKAN_GRAFANA_PASSWORD:-}
      SOKKAN_GRAFANA_PUBLIC_URL: ${SOKKAN_GRAFANA_PUBLIC_URL:-}
      SOKKAN_INFRA_NODES: ${SOKKAN_INFRA_NODES:-}
      SOKKAN_HOSTS_FILE: ${SOKKAN_HOSTS_FILE:-}
      SOKKAN_RDNS_TIMEOUT_S: ${SOKKAN_RDNS_TIMEOUT_S:-}
      SOKKAN_NOTIFY_HITL_DELAY_S: ${SOKKAN_NOTIFY_HITL_DELAY_S:-}
      # Preview: browser binary (none in this image — the feature is off unless one is found),
      # screenshot folder, repositories offered to the diff (JSON)
      SOKKAN_CHROMIUM: ${SOKKAN_CHROMIUM:-}
      SOKKAN_SHOT_DIR: ${SOKKAN_SHOT_DIR:-}
      SOKKAN_REPOS: ${SOKKAN_REPOS:-}
      # memory: host of the `db` service, reindex period, 2.x priority boost, migration retry
      SOKKAN_DB_HOST: ${SOKKAN_DB_HOST:-}
      SOKKAN_REINDEX_S: ${SOKKAN_REINDEX_S:-}
      SOKKAN_PRIORITY_BOOST: ${SOKKAN_PRIORITY_BOOST:-}
      SOKKAN_MIGRATION_RETRY_S: ${SOKKAN_MIGRATION_RETRY_S:-}
      # OpenBao fine settings, Teams service hosts, managed provisioning, session runners
      SOKKAN_OPENBAO_ALLOW_HTTP: ${SOKKAN_OPENBAO_ALLOW_HTTP:-}
      SOKKAN_OPENBAO_APPROLE_MOUNT: ${SOKKAN_OPENBAO_APPROLE_MOUNT:-}
      SOKKAN_OPENBAO_PREFIX: ${SOKKAN_OPENBAO_PREFIX:-}
      SOKKAN_OPENBAO_TIMEOUT_S: ${SOKKAN_OPENBAO_TIMEOUT_S:-}
      SOKKAN_TEAMS_SERVICE_HOSTS: ${SOKKAN_TEAMS_SERVICE_HOSTS:-}
      SOKKAN_PROVISIONER_URL: ${SOKKAN_PROVISIONER_URL:-}
      SOKKAN_PROVISIONER_TOKEN: ${SOKKAN_PROVISIONER_TOKEN:-}
      SOKKAN_RUNNER_SECRET: ${SOKKAN_RUNNER_SECRET:-}
      SOKKAN_RUNNER_INSTANCE: ${SOKKAN_RUNNER_INSTANCE:-}
      SOKKAN_RUNNER_RELAY_BIND: ${SOKKAN_RUNNER_RELAY_BIND:-}
      SOKKAN_SESSION_CLI: ${SOKKAN_SESSION_CLI:-}
      SOKKAN_SESSION_NO_PROXY: ${SOKKAN_SESSION_NO_PROXY:-}
      # CortHeXis engine tunables (memory/core: indexer, search, recall, review, bench).
      # Empty = the engine's default; meaning of each: docs/ENVIRONMENT.md
      CORTHEXIS_ACCEPT_GEMMA_TERMS: ${CORTHEXIS_ACCEPT_GEMMA_TERMS:-}
      CORTHEXIS_AUTO_ACTIVATE: ${CORTHEXIS_AUTO_ACTIVATE:-}
      CORTHEXIS_CHUNK_TARGET: ${CORTHEXIS_CHUNK_TARGET:-}
      CORTHEXIS_DB_POOL: ${CORTHEXIS_DB_POOL:-}
      CORTHEXIS_DEAD_PATH_PREFIXES: ${CORTHEXIS_DEAD_PATH_PREFIXES:-}
      CORTHEXIS_DEAD_PATH_ROOTS: ${CORTHEXIS_DEAD_PATH_ROOTS:-}
      CORTHEXIS_EMBED_FALLBACK: ${CORTHEXIS_EMBED_FALLBACK:-}
      CORTHEXIS_EVAL_GENERATE: ${CORTHEXIS_EVAL_GENERATE:-}
      CORTHEXIS_EVAL_GENERATED_WEIGHT: ${CORTHEXIS_EVAL_GENERATED_WEIGHT:-}
      CORTHEXIS_EVAL_MAX_DROP: ${CORTHEXIS_EVAL_MAX_DROP:-}
      CORTHEXIS_EVAL_MIN_QUESTIONS: ${CORTHEXIS_EVAL_MIN_QUESTIONS:-}
      CORTHEXIS_EVAL_NIGHTLY: ${CORTHEXIS_EVAL_NIGHTLY:-}
      CORTHEXIS_INDEX_FILENAME: ${CORTHEXIS_INDEX_FILENAME:-}
      CORTHEXIS_INDEX_MAX_BYTES: ${CORTHEXIS_INDEX_MAX_BYTES:-}
      CORTHEXIS_INDEX_MAX_LINES: ${CORTHEXIS_INDEX_MAX_LINES:-}
      CORTHEXIS_MEMORY_PROJECT: ${CORTHEXIS_MEMORY_PROJECT:-}
      CORTHEXIS_MIGRATE_MTIME: ${CORTHEXIS_MIGRATE_MTIME:-}
      CORTHEXIS_MODEL_BASE_URL: ${CORTHEXIS_MODEL_BASE_URL:-}
      CORTHEXIS_NORMALIZE: ${CORTHEXIS_NORMALIZE:-}
      CORTHEXIS_NORMALIZE_GRACE: ${CORTHEXIS_NORMALIZE_GRACE:-}
      CORTHEXIS_OWNER: ${CORTHEXIS_OWNER:-}
      CORTHEXIS_RECALL_DEDUP: ${CORTHEXIS_RECALL_DEDUP:-}
      CORTHEXIS_RECALL_MIN_WORDS: ${CORTHEXIS_RECALL_MIN_WORDS:-}
      CORTHEXIS_RECALL_PROJECTS: ${CORTHEXIS_RECALL_PROJECTS:-}
      CORTHEXIS_RECALL_REQUIRE_SCOPE: ${CORTHEXIS_RECALL_REQUIRE_SCOPE:-}
      CORTHEXIS_RECALL_RERANK_TOP: ${CORTHEXIS_RECALL_RERANK_TOP:-}
      CORTHEXIS_RECALL_SNIPPETS: ${CORTHEXIS_RECALL_SNIPPETS:-}
      CORTHEXIS_RECALL_SUBAGENT_SNIPPETS: ${CORTHEXIS_RECALL_SUBAGENT_SNIPPETS:-}
      CORTHEXIS_RECALL_SUBAGENT_TOPK: ${CORTHEXIS_RECALL_SUBAGENT_TOPK:-}
      CORTHEXIS_RECALL_THRESHOLD: ${CORTHEXIS_RECALL_THRESHOLD:-}
      CORTHEXIS_RECALL_TOPK: ${CORTHEXIS_RECALL_TOPK:-}
      CORTHEXIS_RECENT_DAYS: ${CORTHEXIS_RECENT_DAYS:-}
      CORTHEXIS_REINDEX_S: ${CORTHEXIS_REINDEX_S:-}
      CORTHEXIS_RERANK: ${CORTHEXIS_RERANK:-}
      CORTHEXIS_RERANK_MODEL: ${CORTHEXIS_RERANK_MODEL:-}
      CORTHEXIS_RERANK_TOP: ${CORTHEXIS_RERANK_TOP:-}
      CORTHEXIS_REVIEW_ACCEPT_KEBAB_FILES: ${CORTHEXIS_REVIEW_ACCEPT_KEBAB_FILES:-}
      CORTHEXIS_REVIEW_CRIT_COOLDOWN_H: ${CORTHEXIS_REVIEW_CRIT_COOLDOWN_H:-}
      CORTHEXIS_REVIEW_DIGEST_AT: ${CORTHEXIS_REVIEW_DIGEST_AT:-}
      CORTHEXIS_REVIEW_DUP_K: ${CORTHEXIS_REVIEW_DUP_K:-}
      CORTHEXIS_REVIEW_EXPECT_HOOK: ${CORTHEXIS_REVIEW_EXPECT_HOOK:-}
      CORTHEXIS_REVIEW_GIANT_WORDS: ${CORTHEXIS_REVIEW_GIANT_WORDS:-}
      CORTHEXIS_REVIEW_HOOK_PATTERN: ${CORTHEXIS_REVIEW_HOOK_PATTERN:-}
      CORTHEXIS_REVIEW_HOOK_SETTINGS: ${CORTHEXIS_REVIEW_HOOK_SETTINGS:-}
      CORTHEXIS_REVIEW_INDEX_LAG_MIN: ${CORTHEXIS_REVIEW_INDEX_LAG_MIN:-}
      CORTHEXIS_REVIEW_MCP_CONFIGS: ${CORTHEXIS_REVIEW_MCP_CONFIGS:-}
      CORTHEXIS_REVIEW_MCP_SERVER: ${CORTHEXIS_REVIEW_MCP_SERVER:-}
      CORTHEXIS_REVIEW_STALE_DAYS: ${CORTHEXIS_REVIEW_STALE_DAYS:-}
      CORTHEXIS_REVIEW_TZ: ${CORTHEXIS_REVIEW_TZ:-}
      CORTHEXIS_REVIEW_UNDATED_TOLERATED: ${CORTHEXIS_REVIEW_UNDATED_TOLERATED:-}
      CORTHEXIS_RRF_K: ${CORTHEXIS_RRF_K:-}
      CORTHEXIS_SEARCH_DENSE_CANDIDATES: ${CORTHEXIS_SEARCH_DENSE_CANDIDATES:-}
      CORTHEXIS_SEARCH_EXACT_MAX_CHUNKS: ${CORTHEXIS_SEARCH_EXACT_MAX_CHUNKS:-}
      CORTHEXIS_SEARCH_FUSION: ${CORTHEXIS_SEARCH_FUSION:-}
      CORTHEXIS_SEARCH_LEXICAL_CANDIDATES: ${CORTHEXIS_SEARCH_LEXICAL_CANDIDATES:-}
      CORTHEXIS_WATCH_S: ${CORTHEXIS_WATCH_S:-}
      CORTHEXIS_WRITE_INDEX: ${CORTHEXIS_WRITE_INDEX:-}
      CORTHEXIS_HEAD_SHARE: ${CORTHEXIS_HEAD_SHARE:-}
      CORTHEXIS_RECALL_BUDGET_S: ${CORTHEXIS_RECALL_BUDGET_S:-}
      CORTHEXIS_REVIEW_DUP_COSINE: ${CORTHEXIS_REVIEW_DUP_COSINE:-}
      # on-prem appliance (deploy/appliance, docs/appliance): supervision heartbeat — nothing is
      # sent unless a URL is set — and the longest support-tunnel opening a person may ask for
      SOKKAN_HEARTBEAT_URL: ${SOKKAN_HEARTBEAT_URL:-}
      SOKKAN_HEARTBEAT_TOKEN: ${SOKKAN_HEARTBEAT_TOKEN:-}
      SOKKAN_HEARTBEAT_INTERVAL_S: ${SOKKAN_HEARTBEAT_INTERVAL_S:-}
      SOKKAN_HEARTBEAT: ${SOKKAN_HEARTBEAT:-}
      SOKKAN_SUPPORT_MAX_HOURS: ${SOKKAN_SUPPORT_MAX_HOURS:-}
      # local model of an on-prem box: set SOKKAN_SHIP_URL and sessions use it through the
      # `router` service below (profile `appliance`), no click in the cockpit. Language of the
      # « model does not answer » messages: en | fr
      SOKKAN_SHIP_URL: ${SOKKAN_SHIP_URL:-}
      SOKKAN_SHIP_ROUTER_URL: ${SOKKAN_SHIP_ROUTER_URL:-}
      SOKKAN_SHIP_ALIAS: ${SOKKAN_SHIP_ALIAS:-}
      SOKKAN_ERROR_LANG: ${SOKKAN_ERROR_LANG:-}
    volumes:
      - ${SOKKAN_WORKSPACE:-./workspace}:/workspace
      - sokkan-data:/data
      # read-write: the Gemma Terms decision taken in the UI is recorded in licence.json
      - corthexis-models:/models
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      # reach services on the Docker host (Magnitude shim :8790, local proxies)
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8097/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Memory store (CortHeXis 3.0): Postgres 16 + pgvector. Internal network only (no
  # published port). The .md notes stay the source of truth; this volume holds the index
  # and the HISTORY of the notes (note_versions, recall_log): back it up.
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sokkan
      POSTGRES_DB: sokkan
      # set SOKKAN_DB_PASSWORD in .env (the default is only reachable from the api container)
      POSTGRES_PASSWORD: ${SOKKAN_DB_PASSWORD:-sokkan}
      # memory budget, sized for the Light profile (4 GB VM); raise on bigger hosts
      SOKKAN_DB_SHARED_BUFFERS: ${SOKKAN_DB_SHARED_BUFFERS:-256MB}
      SOKKAN_DB_MAINTENANCE_WORK_MEM: ${SOKKAN_DB_MAINTENANCE_WORK_MEM:-512MB}
    command: >-
      sh -c 'exec docker-entrypoint.sh postgres
      -c shared_buffers=$${SOKKAN_DB_SHARED_BUFFERS}
      -c maintenance_work_mem=$${SOKKAN_DB_MAINTENANCE_WORK_MEM}
      -c max_parallel_maintenance_workers=2
      -c work_mem=16MB'
    # parallel HNSW builds use dynamic shared memory (Docker's default /dev/shm is 64 MB)
    shm_size: 640mb
    volumes:
      - sokkan-pg:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sokkan -d sokkan"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # one-shot: licence decision (Gemma Terms of Use), download + SHA-256 check, model
  # selection → volume corthexis-models. Interactive first run (shows the terms, asks):
  #   docker compose run --rm corthexis-embed-fetch python /opt/corthexis/models.py setup --interactive
  corthexis-embed-fetch:
    image: python:3.12-slim
    restart: "no"
    command: ["python", "/opt/corthexis/models.py", "setup"]
    environment:
      CORTHEXIS_MODELS_DIR: /models
      # empty profile + ML_SERVICE_URL = SOKKAN 2.x remote embeddings: nothing to install
      CORTHEXIS_MEMORY_PROFILE: ${CORTHEXIS_MEMORY_PROFILE:-${SOKKAN_MEMORY_PROFILE:-}}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-}
      # explicit unattended answer to the Gemma Terms of Use: 1 = accept, 0 = decline;
      # empty = undecided → the MIT fallback runs until someone accepts
      CORTHEXIS_ACCEPT_GEMMA_TERMS: ${CORTHEXIS_ACCEPT_GEMMA_TERMS:-${SOKKAN_ACCEPT_GEMMA_TERMS:-}}
      CORTHEXIS_EMBED_FALLBACK: ${CORTHEXIS_EMBED_FALLBACK:-}
      CORTHEXIS_OWNER: ${CORTHEXIS_OWNER:-${SOKKAN_OWNER_EMAIL:-}}
      CORTHEXIS_MODEL_BASE_URL: ${CORTHEXIS_MODEL_BASE_URL:-}
      CORTHEXIS_RERANK: ${CORTHEXIS_RERANK:-}
    volumes:
      - corthexis-models:/models
      - ./memory/core/models.py:/opt/corthexis/models.py:ro
    security_opt:
      - no-new-privileges:true

  # llama.cpp --embedding (EmbeddingGemma-300m Q8, or the MIT fallback when the terms
  # are declined). Not published on the host: the api reaches it on the compose network.
  corthexis-embed:
    <<: *llamacpp
    command: ["embed"]
    environment:
      CORTHEXIS_MEMORY_PROFILE: ${CORTHEXIS_MEMORY_PROFILE:-${SOKKAN_MEMORY_PROFILE:-leger}}
      CORTHEXIS_EMBED_DEVICE: cpu
    mem_limit: ${CORTHEXIS_EMBED_MEM:-2g}

  # llama.cpp --reranking (compose profile `rerank`: Standard = background only,
  # GPU = interactive top 10)
  corthexis-rerank:
    <<: *llamacpp
    profiles: ["rerank"]
    command: ["rerank"]
    environment:
      CORTHEXIS_MEMORY_PROFILE: ${CORTHEXIS_MEMORY_PROFILE:-${SOKKAN_MEMORY_PROFILE:-leger}}
      CORTHEXIS_EMBED_DEVICE: cpu
    mem_limit: ${CORTHEXIS_RERANK_MEM:-3g}

  # Fleet edge (managed / opt-in): terminates the client's CUSTOM domains on
  # 80/443 with on-demand Let's Encrypt TLS. Serves only hostnames approved by
  # the api (`/api/edge/ask`); config is rendered by backend/edge.py from the
  # fleet view. Enable with COMPOSE_PROFILES=edge (set automatically on managed
  # VMs). Self-hosted default: off — nothing binds 80/443.
  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["edge"]
    command: sh -c "while [ ! -f /sokkan-data/edge/Caddyfile ]; do sleep 2; done;
      exec caddy run --config /sokkan-data/edge/Caddyfile --adapter caddyfile --watch"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - sokkan-data:/sokkan-data:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    security_opt:
      - no-new-privileges:true

  # On-prem appliance (COMPOSE_PROFILES=appliance, docs/appliance/README.md): the local
  # Ship → Deep router. Sessions talk to it; ordinary requests go to the model served on this
  # machine (SOKKAN_SHIP_URL — vLLM / llama.cpp, Anthropic Messages API), the hard ones to the
  # operator gateway (SOKKAN_DEEP_URL + the instance token). Same image as the api, another
  # entrypoint; no volume, no secret but the gateway token, never published on the host.
  router:
    build: { context: ., dockerfile: docker/api.Dockerfile, args: { SOKKAN_COMMIT: "${SOKKAN_COMMIT:-unknown}" } }
    restart: unless-stopped
    profiles: ["appliance"]
    user: "1000:1000"
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    entrypoint: ["uvicorn", "shiprouter:app", "--host", "0.0.0.0", "--port", "8096", "--app-dir", "/app/backend"]
    environment:
      SOKKAN_SHIP_URL: ${SOKKAN_SHIP_URL:-}
      SOKKAN_SHIP_MODEL: ${SOKKAN_SHIP_MODEL:-}
      SOKKAN_SHIP_TOKEN: ${SOKKAN_SHIP_TOKEN:-}
      SOKKAN_SHIP_TIMEOUT_S: ${SOKKAN_SHIP_TIMEOUT_S:-}
      SOKKAN_SHIP_CONNECT_TIMEOUT_S: ${SOKKAN_SHIP_CONNECT_TIMEOUT_S:-}
      SOKKAN_SHIP_FALLBACK_DEEP: ${SOKKAN_SHIP_FALLBACK_DEEP:-}
      SOKKAN_DEEP_URL: ${SOKKAN_DEEP_URL:-}
      SOKKAN_DEEP_TOKEN: ${SOKKAN_DEEP_TOKEN:-}
      SOKKAN_DEEP_MODEL: ${SOKKAN_DEEP_MODEL:-}
      SOKKAN_DEEP_FORWARD_USER: ${SOKKAN_DEEP_FORWARD_USER:-}
      SOKKAN_ESCALATION: ${SOKKAN_ESCALATION:-}
      SOKKAN_ESCALATION_KEYWORDS: ${SOKKAN_ESCALATION_KEYWORDS:-}
      SOKKAN_ESCALATION_MAX_FAILS: ${SOKKAN_ESCALATION_MAX_FAILS:-}
      SOKKAN_ESCALATION_REPEAT_FAILS: ${SOKKAN_ESCALATION_REPEAT_FAILS:-}
      SOKKAN_ESCALATION_MIN_PROMPT_TOKENS: ${SOKKAN_ESCALATION_MIN_PROMPT_TOKENS:-}
      SOKKAN_ERROR_LANG: ${SOKKAN_ERROR_LANG:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8096/health', timeout=8)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # HTTPS on the local network (COMPOSE_PROFILES=appliance, or `tls` alone): Caddy with its
  # own local certificate authority — no public DNS, no Let's Encrypt, works offline. Serves
  # the names of SOKKAN_TLS_SITES → web. The root certificate to install once on each
  # workstation: scripts/appliance/export-ca.sh. (`edge` above is something else: public
  # custom domains with Let's Encrypt, for managed fleets.)
  tls:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    profiles: ["appliance", "tls"]
    environment:
      SOKKAN_TLS_SITES: ${SOKKAN_TLS_SITES:-https://sokkan.lan, https://localhost}
    ports:
      - "${SOKKAN_TLS_BIND:-0.0.0.0}:${SOKKAN_TLS_PORT:-443}:443"
    volumes:
      - ./deploy/appliance/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    security_opt:
      - no-new-privileges:true

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    restart: unless-stopped
    environment:
      SOKKAN_API: http://api:8097
    ports:
      # SOKKAN_BIND=127.0.0.1 keeps the plain-HTTP port off the network (then reach the
      # cockpit through the `tls` service below, or your own reverse proxy). Default: every
      # interface, as before — on a network you do not fully trust, set it.
      - "${SOKKAN_BIND:-0.0.0.0}:${SOKKAN_PORT:-3009}:3000"
    depends_on:
      - api
    security_opt:
      - no-new-privileges:true

volumes:
  sokkan-data:
  sokkan-pg:
  corthexis-models:
  caddy-data:
  caddy-config:
