# Intel GPU (Arc / Arc Pro / Data Center) — llama.cpp SYCL build.
# Adds corthexis-embed-gpu in front of the CPU server (the client tries the GPU
# first, the CPU one if the card is busy or gone: same model, same vectors) and
# moves the reranker to the GPU. Measured on an Arc Pro B60: embedding +0.5 GB
# VRAM, 13 ms per query; Qwen3-Reranker-0.6B +3.0 GB. Pick the card with
# CORTHEXIS_GPU_DEVICE (Level Zero index, default 0).
x-sycl: &sycl
  image: ghcr.io/ggml-org/llama.cpp:${CORTHEXIS_LLAMACPP_SYCL_TAG:-server-intel-b11347}
  devices:
    - /dev/dri:/dev/dri
  restart: on-failure:3  # a server that cannot load stops instead of looping on the card

services:
  corthexis-embed-gpu:
    extends: { file: compose.yml, service: corthexis-embed }
    <<: *sycl
    environment:
      CORTHEXIS_MEMORY_PROFILE: gpu
      CORTHEXIS_EMBED_DEVICE: gpu
      ZE_AFFINITY_MASK: ${CORTHEXIS_GPU_DEVICE:-0}
    mem_limit: ${CORTHEXIS_EMBED_GPU_MEM:-4g}

  corthexis-rerank:
    <<: *sycl
    environment:
      CORTHEXIS_MEMORY_PROFILE: gpu
      CORTHEXIS_EMBED_DEVICE: gpu
      ZE_AFFINITY_MASK: ${CORTHEXIS_GPU_DEVICE:-0}
    mem_limit: ${CORTHEXIS_RERANK_MEM:-4g}
