# NVIDIA GPU — llama.cpp CUDA build (needs the NVIDIA Container Toolkit). An OVERRIDE of
# the SOKKAN docker-compose.yml (paths are relative to the sokkan folder):
#   docker compose -f docker-compose.yml -f docker/embed/compose.cuda.yml up -d
# scripts/memory-setup.sh writes it to .env for the GPU profile (COMPOSE_FILE).
# Same layout as compose.sycl.yml: GPU embedding server in front of the CPU one,
# reranker on the GPU. Pick the card with CORTHEXIS_GPU_DEVICE (default 0).
x-cuda: &cuda
  image: ghcr.io/ggml-org/llama.cpp:${CORTHEXIS_LLAMACPP_CUDA_TAG:-server-cuda-b11347}
  restart: on-failure:3
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["${CORTHEXIS_GPU_DEVICE:-0}"]
            capabilities: [gpu]

services:
  corthexis-embed-gpu:
    extends: { file: docker-compose.yml, service: corthexis-embed }
    <<: *cuda
    environment:
      CORTHEXIS_MEMORY_PROFILE: gpu
      CORTHEXIS_EMBED_DEVICE: gpu
    mem_limit: ${CORTHEXIS_EMBED_GPU_MEM:-4g}

  corthexis-rerank:
    <<: *cuda
    environment:
      CORTHEXIS_MEMORY_PROFILE: gpu
      CORTHEXIS_EMBED_DEVICE: gpu
    mem_limit: ${CORTHEXIS_RERANK_MEM:-4g}
