name: sokkan-simple-before
base_url: http://100.124.110.23:3853
widths:
- 1440
- 390
themes:
- dark
- light
settle_ms: 1500
locale: fr-CH
ignore_requests:
- /api/auth/local
pages:
- name: 01-landing
  path: /?plane=build&tab=sessions
  viewport_only: true
  steps:
  - &id001
    fill:
      selector: input[type=password]
      value: <token of the disposable instance>
  - &id002
    click: text=Sign in
  - &id003
    wait: 2500
- name: 02-thread
  path: /?plane=build&tab=sessions
  viewport_only: true
  steps:
  - *id001
  - *id002
  - *id003
  - click: text=Plan de formation Excel
  - wait: 3000
- name: 03-new-session
  path: /?plane=build&tab=sessions
  viewport_only: true
  steps:
  - *id001
  - *id002
  - *id003
  - click: text=+ session
  - wait: 800
- name: 04-nina
  path: /?plane=build&tab=sessions
  viewport_only: true
  steps:
  - *id001
  - *id002
  - *id003
  - click: '[aria-label=''Open Nina'']'
  - wait: 1200
