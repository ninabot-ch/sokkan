<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 676" width="1280" height="676" role="img" aria-label="SOKKAN Enterprise pipelines">
<title>SOKKAN Enterprise pipelines</title>
<style>
svg{--bg:#ffffff;--panel:#f6f8fa;--tile:#ffffff;--ink:#1f2328;--muted:#59636e;--line:#d1d9e0;
--edge:#59636e;--acc:#6639ba;--accbg:#f3eeff;--ok:#1a7f37;--wip:#9a6700;--plan:#6e7781}
@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--panel:#151b23;--tile:#0d1117;--ink:#e6edf3;
--muted:#9198a1;--line:#3d444d;--edge:#9198a1;--acc:#a371f7;--accbg:#1e1534;--ok:#3fb950;--wip:#d29922;--plan:#9198a1}}
text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--ink)}
.bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.tile{fill:var(--tile);stroke:var(--line);stroke-width:1}
.acc{fill:var(--accbg);stroke:var(--acc);stroke-width:1.4}
.planned{stroke-dasharray:6 4;stroke:var(--plan)}
.h1{font-size:22px;font-weight:700} .h2{font-size:15px;font-weight:700} .h3{font-size:13px;font-weight:700}
.t{font-size:12.5px} .s{font-size:11.5px;fill:var(--muted)} .k{font-size:11px;font-weight:700;fill:var(--acc);letter-spacing:.06em}
.ok{fill:var(--ok)} .wip{fill:var(--wip)} .plan{fill:var(--plan)}
.edge{stroke:var(--edge);stroke-width:1.6;fill:none} .edged{stroke:var(--edge);stroke-width:1.6;fill:none;stroke-dasharray:5 4}
.ah{fill:var(--edge)} .lbl{font-size:11.5px;fill:var(--muted);font-style:italic} .lblbg{fill:var(--bg)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
<rect class="bg" width="1280" height="676"/>
<text x="24" y="38" class="h1" text-anchor="start">SOKKAN Enterprise — pipelines</text>
<text x="24" y="60" class="s" text-anchor="start">A. One model call, from the prompt to the audit trail.   B. One release, from the branch to the fleet.</text>
<circle cx="805" cy="31.5" r="4.6" class="ok"/><text x="815" y="36" class="s" text-anchor="start">shipped (3.1.x)</text>
<circle cx="930" cy="31.5" r="3.8999999999999995" fill="none" stroke="var(--wip)" stroke-width="1.4"/><path d="M930 27.599999999999998 A3.8999999999999995 3.8999999999999995 0 0 0 930 35.4 Z" class="wip"/><text x="940" y="36" class="s" text-anchor="start">in progress (3.2 branch)</text>
<circle cx="1095" cy="31.5" r="3.8999999999999995" fill="none" stroke="var(--plan)" stroke-width="1.4"/><text x="1105" y="36" class="s" text-anchor="start">planned (3.2+ · 3.3 · 3.4)</text>
<text x="24" y="98" class="k" text-anchor="start">A · REQUEST / TASK PIPELINE</text>
<rect x="40" y="112" width="200" height="112" rx="10" class="panel"/>
<circle cx="59" cy="133.5" r="4.6" class="ok"/><text x="69" y="138" class="h3" text-anchor="start">1 Prompt</text>
<text x="54" y="164" class="t" text-anchor="start">cockpit, VS Code, CLI</text>
<text x="54" y="182" class="t" text-anchor="start">or an agent run</text>
<path d="M240 168 L264 168" class="edge" marker-end="url(#a)"/>
<rect x="264" y="112" width="200" height="112" rx="10" class="panel"/>
<circle cx="283" cy="133.5" r="4.6" class="ok"/><text x="293" y="138" class="h3" text-anchor="start">2 Session policy</text>
<text x="278" y="164" class="t" text-anchor="start">allowed tools, HITL gate,</text>
<text x="278" y="182" class="t" text-anchor="start">secrets by name, budget</text>
<path d="M464 168 L488 168" class="edge" marker-end="url(#a)"/>
<rect x="488" y="112" width="200" height="112" rx="10" class="panel"/>
<circle cx="507" cy="133.5" r="4.6" class="ok"/><text x="517" y="138" class="h3" text-anchor="start">3 Scrubber</text>
<text x="502" y="164" class="t" text-anchor="start">secrets → request blocked</text>
<text x="502" y="182" class="t" text-anchor="start">PII → masked, irreversible</text>
<path d="M688 168 L712 168" class="edge" marker-end="url(#a)"/>
<rect x="712" y="112" width="200" height="112" rx="10" class="panel"/>
<circle cx="731" cy="133.5" r="4.6" class="ok"/><text x="741" y="138" class="h3" text-anchor="start">4 Balance gate</text>
<text x="726" y="164" class="t" text-anchor="start">prepaid balance checked</text>
<text x="726" y="182" class="t" text-anchor="start">before any billed tier</text>
<path d="M912 168 L936 168" class="edge" marker-end="url(#a)"/>
<rect x="936" y="112" width="304" height="232" rx="10" class="acc"/>
<circle cx="955" cy="131.5" r="4.6" class="ok"/><text x="965" y="136" class="h3" text-anchor="start">5 Tier chain</text>
<text x="950" y="154" class="s" text-anchor="start">start tier = keywords of the human turn</text>
<rect x="950" y="166" width="150" height="46" rx="8" class="tile"/>
<circle cx="965" cy="183.5" r="4.6" class="ok"/><text x="975" y="188" class="h3" text-anchor="start">Ship</text>
<text x="960" y="208" class="s" text-anchor="start">fast open model</text>
<path d="M1025 212 L1025 224" class="edge" marker-end="url(#a)"/>
<rect x="950" y="224" width="150" height="46" rx="8" class="tile"/>
<circle cx="965" cy="241.5" r="4.6" class="ok"/><text x="975" y="246" class="h3" text-anchor="start">Deep</text>
<text x="960" y="266" class="s" text-anchor="start">large open model</text>
<path d="M1025 270 L1025 282" class="edge" marker-end="url(#a)"/>
<rect x="950" y="282" width="150" height="46" rx="8" class="tile"/>
<circle cx="965" cy="299.5" r="3.8999999999999995" fill="none" stroke="var(--wip)" stroke-width="1.4"/><path d="M965 295.59999999999997 A3.8999999999999995 3.8999999999999995 0 0 0 965 303.40000000000003 Z" class="wip"/><text x="975" y="304" class="h3" text-anchor="start">Claude</text>
<text x="960" y="324" class="s" text-anchor="start">customer's key (BYOK)</text>
<text x="1112" y="196" class="s" text-anchor="start">&lt;&lt;ESCALATE&gt;&gt;</text>
<text x="1112" y="212" class="s" text-anchor="start">or upstream</text>
<text x="1112" y="228" class="s" text-anchor="start">failure → next</text>
<text x="1112" y="254" class="s" text-anchor="start">tier kept for</text>
<text x="1112" y="270" class="s" text-anchor="start">the human turn,</text>
<text x="1112" y="286" class="s" text-anchor="start">then decided</text>
<text x="1112" y="302" class="s" text-anchor="start">again</text>
<rect x="964" y="372" width="276" height="104" rx="10" class="panel"/>
<circle cx="983" cy="393.5" r="3.8999999999999995" fill="none" stroke="var(--wip)" stroke-width="1.4"/><path d="M983 389.59999999999997 A3.8999999999999995 3.8999999999999995 0 0 0 983 397.40000000000003 Z" class="wip"/><text x="993" y="398" class="h3" text-anchor="start">6 Metering</text>
<text x="978" y="424" class="t" text-anchor="start">tokens in / cache / out,</text>
<text x="978" y="442" class="t" text-anchor="start">avoided-Claude-cost report</text>
<rect x="676" y="372" width="276" height="104" rx="10" class="panel"/>
<circle cx="695" cy="393.5" r="4.6" class="ok"/><text x="705" y="398" class="h3" text-anchor="start">7 Response</text>
<text x="690" y="424" class="t" text-anchor="start">secrets redacted in live events,</text>
<text x="690" y="442" class="t" text-anchor="start">replay and deliverables</text>
<rect x="388" y="372" width="276" height="104" rx="10" class="panel"/>
<circle cx="407" cy="393.5" r="4.6" class="ok"/><text x="417" y="398" class="h3" text-anchor="start">8 Memory quarantine</text>
<text x="402" y="424" class="t" text-anchor="start">notes written by agent runs</text>
<text x="402" y="442" class="t" text-anchor="start">wait for a human review</text>
<rect x="40" y="372" width="324" height="104" rx="10" class="panel"/>
<circle cx="59" cy="393.5" r="4.6" class="ok"/><text x="69" y="398" class="h3" text-anchor="start">9 Audit journal</text>
<text x="54" y="424" class="t" text-anchor="start">who did what, in which</text>
<text x="54" y="442" class="t" text-anchor="start">project, approved by whom</text>
<path d="M1088 344 L1088 372" class="edge" marker-end="url(#a)"/>
<path d="M964 424 L952 424" class="edge" marker-end="url(#a)"/>
<path d="M676 424 L664 424" class="edge" marker-end="url(#a)"/>
<path d="M388 424 L364 424" class="edge" marker-end="url(#a)"/>
<text x="24" y="520" class="k" text-anchor="start">B · RELEASE PIPELINE (docs/RELEASING.md)</text>
<rect x="40" y="534" width="185" height="96" rx="10" class="panel"/>
<circle cx="59" cy="553.5" r="4.6" class="ok"/><text x="69" y="558" class="h3" text-anchor="start">Branch + tests</text>
<text x="54" y="584" class="t" text-anchor="start">pytest (+ Postgres), ruff,</text>
<text x="54" y="602" class="t" text-anchor="start">tsc, next build, e2e CLI</text>
<path d="M225 582 L243 582" class="edge" marker-end="url(#a)"/>
<rect x="243" y="534" width="185" height="96" rx="10" class="panel"/>
<circle cx="262" cy="553.5" r="4.6" class="ok"/><text x="272" y="558" class="h3" text-anchor="start">Semver check</text>
<text x="257" y="584" class="t" text-anchor="start">patch = fixes only;</text>
<text x="257" y="602" class="t" text-anchor="start">git diff vX.Y.Z..HEAD</text>
<path d="M428 582 L446 582" class="edge" marker-end="url(#a)"/>
<rect x="446" y="534" width="185" height="96" rx="10" class="panel"/>
<circle cx="465" cy="553.5" r="4.6" class="ok"/><text x="475" y="558" class="h3" text-anchor="start">Changelog</text>
<text x="460" y="584" class="t" text-anchor="start">VERSION + upgrade notes</text>
<text x="460" y="602" class="t" text-anchor="start">for every behaviour change</text>
<path d="M631 582 L649 582" class="edge" marker-end="url(#a)"/>
<rect x="649" y="534" width="185" height="96" rx="10" class="panel"/>
<circle cx="668" cy="553.5" r="4.6" class="ok"/><text x="678" y="558" class="h3" text-anchor="start">Cut</text>
<text x="663" y="584" class="t" text-anchor="start">tag, never moved;</text>
<text x="663" y="602" class="t" text-anchor="start">tarball named by hash</text>
<path d="M834 582 L852 582" class="edge" marker-end="url(#a)"/>
<rect x="852" y="534" width="185" height="96" rx="10" class="panel"/>
<circle cx="871" cy="553.5" r="4.6" class="ok"/><text x="881" y="558" class="h3" text-anchor="start">Channels</text>
<text x="866" y="584" class="t" text-anchor="start">installer · managed cloud</text>
<text x="866" y="602" class="t" text-anchor="start">rollout · public demo</text>
<path d="M1037 582 L1055 582" class="edge" marker-end="url(#a)"/>
<rect x="1055" y="534" width="185" height="96" rx="10" class="panel"/>
<circle cx="1074" cy="553.5" r="4.6" class="ok"/><text x="1084" y="558" class="h3" text-anchor="start">Roll back</text>
<text x="1069" y="584" class="t" text-anchor="start">scripts/rollback.sh &lt;hash&gt;</text>
<text x="1069" y="602" class="t" text-anchor="start">keeps .env and volumes</text>
<text x="40" y="656" class="s" text-anchor="start">Enterprise features are switched on per instance, one by one, after the upgrade (see FEATURES.md).</text>
</svg>
